name = "openclaw-watchdog"
main = "src/index.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[[kv_namespaces]]
binding = "KV"
id = "88e4ba489aba44b389162ecca1f90e38"

# Secrets (set via: wrangler secret put VARNAME)
# WATCHDOG_SECRET   — VPS uses this to authenticate heartbeats
# ADMIN_TOKEN       — for /command and /status endpoints
# TELEGRAM_BOT_TOKEN
# TELEGRAM_USER_ID  — Eric's Telegram user ID (1514810057)
# TELEGRAM_WEBHOOK_SECRET — for Telegram webhook verification
