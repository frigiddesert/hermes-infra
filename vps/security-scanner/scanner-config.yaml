# Fleet dependency + secret scan targets (heimdall issue #24).
#
# Seeded from the heimdall apps registry (D1 `apps` table, repo slugs) plus repos with active
# commits/deploys this sprint (2026-08). `app_id` is the heimdall app id events are attributed to —
# null means the repo isn't a registered heimdall app (scanned anyway; events use the repo name as
# appId). `dependabot: true` is just a hint — if the gh api call comes back 403/404 (disabled or
# not accessible), dependency_scan.py falls back to shallow-clone + npm audit automatically.
#
# This is NOT general YAML — see config.py's parser. Keep it flat: repos: - key: value pairs only.
repos:
  - repo: heimdall
    app_id: heimdall-platform
    dependabot: true
  - repo: feedback-widget
